<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <style>
        {{template "layoutStyles" .}}
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #334155; }
        input[type="text"] {
            width: 100%; padding: 11px 13px; border: 1px solid var(--border);
            border-radius: 9px; font-size: 14px; background: #f8fafc;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        input[type="text"]:focus {
            border-color: var(--primary); background: #fff; outline: 0;
            box-shadow: 0 0 0 3px rgba(79,70,229,.15);
        }
        .CodeMirror { border: 1px solid var(--border); border-radius: 9px; height: 420px; font-size: 13px; }
        .actions { display: flex; gap: 12px; margin-top: 22px; align-items: center; }
        .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
        .hint code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; color: #4338ca; }
    </style>
</head>
<body>
    {{template "topbar" .}}
    <main class="content">
        {{template "flash" .}}
        <section class="card">
            <h2>⚙️ 基础配置 <span class="sub">修改后点击保存即可生效</span></h2>
            <form id="config-form" action="/save" method="post">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="webhook_url">飞书 Webhook URL</label>
                        <input type="text" id="webhook_url" name="webhook_url" value="{{.WebhookURL}}" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxxx">
                    </div>
                    <div class="form-group">
                        <label for="firing_title">告警标题 (Firing)</label>
                        <input type="text" id="firing_title" name="firing_title" value="{{.FiringTitle}}">
                    </div>
                    <div class="form-group">
                        <label for="resolved_title">恢复标题 (Resolved)</label>
                        <input type="text" id="resolved_title" name="resolved_title" value="{{.ResolvedTitle}}">
                    </div>
                    <div class="form-group full">
                        <label for="template">卡片模板 (JSON)</label>
                        <textarea id="template" name="template">{{.TemplateContent}}</textarea>
                        <p class="hint">支持占位符：<code>{alertname}</code> <code>{severity}</code> <code>{instance}</code> <code>{description}</code> <code>{start_time}</code> <code>{card_color}</code> <code>{header_title}</code>。参考 <a href="https://open.feishu.cn/document/ukTMukTMukTM/uADOwUjLwgDM14CM4ATN" target="_blank">飞书卡片搭建指南</a></p>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-success">💾 保存配置</button>
                    <button type="button" class="btn btn-primary" onclick="document.getElementById('test-form').submit();">🚀 发送测试</button>
                </div>
            </form>
            <form id="test-form" action="/test" method="post" style="display:none;"></form>
        </section>
    </main>
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("template"), {
            lineNumbers: true,
            mode: { name: "javascript", json: true },
            theme: "monokai",
            matchBrackets: true,
            autoCloseBrackets: true
        });
        editor.refresh();
    </script>
</body>
</html>
