<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 管理后台</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(900px 500px at 80% -10%, #c7d2fe 0%, transparent 60%),
                        radial-gradient(800px 400px at 0% 110%, #ddd6fe 0%, transparent 55%), #f1f5f9;
        }
        .login-card {
            background: #fff; width: 100%; max-width: 380px; padding: 34px 32px; border-radius: 18px;
            box-shadow: 0 20px 50px rgba(79,70,229,.18); border: 1px solid #eef2ff;
        }
        .login-card .brand { text-align: center; margin-bottom: 24px; }
        .login-card .brand .logo { font-size: 34px; }
        .login-card .brand h1 { font-size: 19px; margin: 10px 0 2px; color: #1e293b; }
        .login-card .brand p { font-size: 13px; color: #94a3b8; margin: 0; }
        label { display: block; font-weight: 600; font-size: 13px; color: #334155; margin: 14px 0 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; background: #f8fafc;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        input:focus { border-color: #4f46e5; background: #fff; outline: 0; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
        .submit {
            width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; font-size: 15px; font-weight: 700;
            box-shadow: 0 8px 22px rgba(79,70,229,.35); transition: transform .12s;
        }
        .submit:hover { transform: translateY(-1px); }
        .flash { padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
        .flash.error { background: #fee2e2; color: #7f1d1d; border: 1px solid #fecaca; }
        .flash.success { background: #dcfce7; color: #14532d; border: 1px solid #bbf7d0; }
        .back { text-align: center; margin-top: 18px; }
        .back a { color: #6366f1; font-size: 13px; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="logo">📡</div>
            <h1>管理后台登录</h1>
            <p>Prometheus → 飞书 告警网关</p>
        </div>
        {{if .FlashMessage}}<div class="flash {{.FlashKind}}">{{.FlashMessage}}</div>{{end}}
        <form method="post">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" required>
            <button type="submit" class="submit">登录</button>
        </form>
        <div class="back"><a href="/">← 返回首页</a></div>
    </div>
</body>
</html>
