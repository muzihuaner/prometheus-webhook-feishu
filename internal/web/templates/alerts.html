<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警历史 &middot; 管理后台</title>
    <style>
        {{template "layoutStyles" .}}
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 16px 20px;
        }
        .stat .num { font-size: 28px; font-weight: 700; line-height: 1; }
        .stat .lbl { color: var(--text-secondary); font-size: 13px; margin-top: 6px; }
        .stat .dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
            vertical-align: middle;
        }
        .stat.total .num { color: var(--primary); }
        .stat.total .dot { background: var(--primary); }
        .stat.ok .num { color: var(--success); }
        .stat.ok .dot { background: var(--success); }
        .stat.bad .num { color: var(--danger); }
        .stat.bad .dot { background: var(--danger); }
        .stat.err .num { color: var(--warning); }
        .stat.err .dot { background: var(--warning); }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .toolbar select, .toolbar input[type="text"] {
            padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius);
            font-size: 14px; background: #fff; color: var(--text);
        }
        .toolbar input[type="text"] { flex: 1; min-width: 180px; }
        .toolbar .spacer { flex: 1; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
        thead th {
            text-align: left; padding: 12px 16px; background: #f8fafc; color: #475569;
            font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
            font-size: 13px;
        }
        tbody td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tbody tr:hover { background: #fafbfc; }
        tbody tr:last-child td { border-bottom: none; }
        .status-dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.s-success { background: var(--success); }
        .status-dot.s-failed  { background: var(--danger); }
        .status-dot.s-error   { background: var(--warning); }
        .status-text { font-size: 13px; vertical-align: middle; }
        .kind-text { font-size: 13px; }
        .kind-text.firing { color: var(--danger); }
        .kind-text.resolved { color: var(--success); }
        .sev { font-weight: 500; font-size: 13px; }
        .sev.critical { color: var(--danger); }
        .sev.warning { color: var(--warning); }
        .sev.info, .sev.none { color: var(--text-secondary); }
        .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 500; padding: 0; }
        .link-btn:hover { text-decoration: underline; }
        .empty { text-align: center; color: var(--text-secondary); padding: 48px 0; font-size: 14px; }
        .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .modal-mask.open { display: flex; }
        .modal { background: #fff; border-radius: var(--radius-lg); max-width: 640px; width: 100%; max-height: 85vh; overflow: auto; }
        .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); line-height: 1; padding: 0 4px; }
        .modal-close:hover { color: var(--text); }
        .modal-body { padding: 22px; }
        .kv { display: grid; grid-template-columns: 100px 1fr; gap: 10px 14px; font-size: 14px; margin-bottom: 16px; }
        .kv .k { color: var(--text-secondary); font-size: 13px; }
        .kv .v { word-break: break-all; }
        .detail-list { border-top: 1px solid var(--border); margin-top: 4px; }
        .detail-item { padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .detail-item:last-child { border-bottom: none; }
        .detail-item .name { font-weight: 500; }
        .detail-item .meta { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }
        .err-box { background: var(--danger-bg); color: #7f1d1d; padding: 12px 14px; border-radius: var(--radius); font-size: 13px; word-break: break-all; }
        .ok-box { background: var(--success-bg); color: #14532d; padding: 12px 14px; border-radius: var(--radius); font-size: 13px; }
        .detail-section-title { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
        @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        @media (prefers-color-scheme: dark) {
            table { background: #1e293b; }
            thead th { background: #0f172a; color: #94a3b8; }
            tbody td { border-bottom-color: #1e293b; }
            tbody tr:hover { background: #1a2332; }
            .modal { background: #1e293b; }
            .modal-head { border-bottom-color: #334155; }
            .detail-item { border-bottom-color: #1e293b; }
            select, input[type="text"] { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        }
    </style>
</head>
<body>
    {{template "topbar" .}}
    <main class="content">
        {{template "flash" .}}
        <div class="stats">
            <div class="stat total"><div class="num"><span class="dot"></span>{{.Total}}</div><div class="lbl">累计告警</div></div>
            <div class="stat ok"><div class="num"><span class="dot"></span>{{.SuccessCount}}</div><div class="lbl">推送成功</div></div>
            <div class="stat bad"><div class="num"><span class="dot"></span>{{.FailedCount}}</div><div class="lbl">推送失败</div></div>
            <div class="stat err"><div class="num"><span class="dot"></span>{{.ErrorCount}}</div><div class="lbl">程序异常</div></div>
        </div>

        <div class="toolbar">
            <select id="filter-status">
                <option value="">全部推送状态</option>
                <option value="success">成功</option>
                <option value="failed">失败</option>
                <option value="error">异常</option>
            </select>
            <select id="filter-kind">
                <option value="">全部类型</option>
                <option value="firing">触发 (firing)</option>
                <option value="resolved">恢复 (resolved)</option>
            </select>
            <input type="text" id="search" placeholder="搜索告警名称 / 实例 / 详情…">
            <button class="btn btn-ghost" id="refresh-btn">刷新</button>
            <div class="spacer"></div>
            <button class="btn btn-danger" id="clear-btn">清空历史</button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>接收时间</th>
                            <th>类型</th>
                            <th>告警名称</th>
                            <th>等级</th>
                            <th>数量</th>
                            <th>推送状态</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="alert-body">
                        <tr><td colspan="7" class="empty">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal-mask" id="modal">
            <div class="modal">
                <div class="modal-head">
                    <h3>告警详情</h3>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>
    </main>
    <script>
        var statusText = { success: "推送成功", failed: "推送失败", error: "程序异常" };
        var fmtTime = function(s) { var d = new Date(s); return isNaN(d) ? s : d.toLocaleString("zh-CN", { hour12: false }); };
        var esc = function(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); };

        var allRecords = [];
        var currentRows = [];

        async function load() {
            var res = await fetch("/api/alerts");
            var data = await res.json();
            allRecords = data.records || [];
            render();
        }

        function filterRecords() {
            var fStatus = document.getElementById("filter-status").value;
            var fKind = document.getElementById("filter-kind").value;
            var q = document.getElementById("search").value.trim().toLowerCase();
            return allRecords.filter(function(r) {
                if (fStatus && r.push_status !== fStatus) return false;
                if (fKind && r.status !== fKind) return false;
                if (q) {
                    var hay = (r.alertname + " " + (r.alerts || []).map(function(a) { return a.instance; }).join(" ") + " " + r.detail).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        }

        function render() {
            currentRows = filterRecords();
            var body = document.getElementById("alert-body");
            if (currentRows.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="empty">暂无符合条件的告警记录</td></tr>';
                return;
            }
            body.innerHTML = currentRows.map(function(r, i) {
                var sev = (r.severity || "none").toLowerCase();
                return '<tr>' +
                    '<td>' + fmtTime(r.received_at) + '</td>' +
                    '<td><span class="kind-text ' + r.status + '">' + (r.status === "resolved" ? "恢复" : "触发") + '</span></td>' +
                    '<td>' + esc(r.alertname) + '</td>' +
                    '<td><span class="sev ' + sev + '">' + esc(r.severity || "-") + '</span></td>' +
                    '<td>' + r.count + '</td>' +
                    '<td><span class="status-dot s-' + r.push_status + '"></span><span class="status-text">' + (statusText[r.push_status] || r.push_status) + '</span></td>' +
                    '<td><button class="link-btn" onclick="showDetail(' + i + ')">查看</button></td>' +
                    '</tr>';
            }).join("");
        }

        function showDetail(idx) {
            var row = currentRows[idx];
            if (!row) return;
            var alertsHtml = (row.alerts || []).map(function(a) {
                return '<div class="detail-item">' +
                    '<div class="name">' + esc(a.alertname || "-") + '</div>' +
                    '<div class="meta">等级: ' + esc(a.severity || "-") + ' · 实例: ' + esc(a.instance || "-") + (a.summary ? " · " + esc(a.summary) : "") + '</div>' +
                    '</div>';
            }).join("") || '<div class="detail-item">无明细</div>';
            var pushBox = row.push_status === "success"
                ? '<div class="ok-box">' + esc(row.detail) + '</div>'
                : '<div class="err-box">' + esc(row.detail) + '</div>';
            document.getElementById("modal-body").innerHTML =
                '<div class="kv">' +
                '<div class="k">接收时间</div><div class="v">' + fmtTime(row.received_at) + '</div>' +
                '<div class="k">类型</div><div class="v">' + (row.status === "resolved" ? "恢复 (resolved)" : "触发 (firing)") + '</div>' +
                '<div class="k">告警数量</div><div class="v">' + row.count + '</div>' +
                '<div class="k">推送状态</div><div class="v"><span class="status-dot s-' + row.push_status + '"></span>' + (statusText[row.push_status] || row.push_status) + '</div>' +
                '</div>' +
                '<div class="detail-section-title">推送结果</div>' +
                pushBox +
                '<div class="detail-section-title">包含告警 (' + (row.alerts ? row.alerts.length : 0) + ')</div>' +
                '<div class="detail-list">' + alertsHtml + '</div>';
            document.getElementById("modal").classList.add("open");
        }

        document.getElementById("modal-close").onclick = function() { document.getElementById("modal").classList.remove("open"); };
        document.getElementById("modal").onclick = function(e) { if (e.target.id === "modal") document.getElementById("modal").classList.remove("open"); };
        document.getElementById("filter-status").onchange = render;
        document.getElementById("filter-kind").onchange = render;
        document.getElementById("search").oninput = render;
        document.getElementById("refresh-btn").onclick = load;
        document.getElementById("clear-btn").onclick = async function() {
            if (!confirm("确定要清空全部告警历史吗？此操作不可恢复。")) return;
            await fetch("/api/alerts/clear", { method: "POST" });
            load();
        };

        load();
    </script>
</body>
</html>
