# 单副本：告警历史与运行时配置均为 Pod 内状态，不支持横向扩缩
replicaCount: 1

image:
  repository: muzihuaner/prometheus-webhook-feishu
  tag: ""            # 空 = 使用 Chart.yaml 的 appVersion (latest)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# 会话 Cookie 签名密钥；不设置则每次启动随机（Pod 重启后登录态失效）
sessionSecret: ""

# 完整 config.json 内容（默认取自 config.example.json）
# 管理后台在线保存的修改仅在本 Pod 生命周期内生效，重启后恢复为此处配置
config:
  USERNAME: admin
  PASSWORD: password
  FIRING_TITLE: "🚨 告警触发"
  RESOLVED_TITLE: "✅ 告警已恢复"
  FEISHU_WEBHOOK_URL: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxx"
  FEISHU_CARD_TEMPLATE:
    msg_type: interactive
    card:
      config:
        wide_screen_mode: true
        enable_forward: true
      header:
        template: "{card_color}"
        title:
          content: "{header_title}"
          tag: plain_text
      elements:
        - tag: div
          fields:
            - is_short: true
              text:
                tag: lark_md
                content: "**告警名称**:\n{alertname}"
            - is_short: true
              text:
                tag: lark_md
                content: "**严重等级**:\n{severity}"
        - tag: div
          fields:
            - is_short: false
              text:
                tag: lark_md
                content: "**涉及实例**:\n{instance}"
        - tag: hr
        - tag: div
          text:
            tag: lark_md
            content: "**详情描述**:\n{description}"
        - tag: hr
        - tag: note
          elements:
            - tag: plain_text
              content: "开始时间: {start_time}"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
